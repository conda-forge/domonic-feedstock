schema_version: 1

context:
  version: "1.8.3"

package:
  name: domonic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/domonic/domonic-${{ version }}.tar.gz
  sha256: 36b3c2a78539544afff055147101927843353b9c0145c70a8db892255b3ae0d6

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - domonic = domonic.__main__:run

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - elementpath >=5.1.4,<6
    - python-dateutil >=2.9.0.post0,<3
    - requests >=2.34.2,<3
    - urllib3 >=2.7.0,<3
    - html5lib >=1.1,<2
    - cssselect >=1.5.0,<2

tests:
  - python:
      imports:
        - domonic
        - domonic.html
        - domonic.dom
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - domonic --help

about:
  homepage: https://github.com/byteface/domonic
  repository: https://github.com/byteface/domonic
  documentation: https://domonic.readthedocs.io/
  license: MIT
  license_file: LICENSE.txt
  summary: Python DOM and HTML toolkit - generate, parse and manipulate HTML/XML/SVG with CSS selectors, XPath, Web APIs and JavaScript-like utilities
  description: |
    domonic is a pure-Python DOM toolkit inspired by the browser platform.
    It gives you one document model for creating, parsing, querying,
    traversing, manipulating and rendering markup.
    Generate HTML, parse real pages, query with CSS or XPath, and manipulate
    a browser-style DOM.

extra:
  recipe-maintainers:
    - byteface
